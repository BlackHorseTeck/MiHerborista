    <script>
      // Gracefully prevent benign Vite dev WebSocket connection errors in preview sandbox
      window.addEventListener('unhandledrejection', function (event) {
        var text = event && event.reason ? (event.reason.message || String(event.reason)) : '';
        if (typeof text === 'string' && (text.indexOf('WebSocket') !== -1 || text.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var text = event && (event.message || '');
        if (typeof text === 'string' && (text.indexOf('WebSocket') !== -1 || text.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
